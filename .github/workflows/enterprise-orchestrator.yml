name: CI-WORKFLOW

on:
  push:
    branches: ["master", "main", "dev"]
  workflow_dispatch:

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: npm install

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test
        run: npm test

  security:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy
        if: success()
        run: echo "my code is deployed"

      - name: Rollback
        if: failure()
        run: echo "rollback is done"
